<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrostatics Simulation: Conduction vs Induction</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/learning-panel.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>
<body>
    <div id="simulation-container">
        <canvas id="simulation-canvas"></canvas>
        
        <div id="controls">
            <div class="control-group">
                <h3>Charging Method</h3>
                <div class="btn-group">
                    <button id="none-mode" class="active">None</button>
                    <button id="conduction-mode">Conduction</button>
                    <button id="induction-mode">Induction</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>Rod Charge: <span id="rod-charge-display">+5.0 μC</span></h3>
                <input type="range" id="rod-charge-slider" min="-10" max="10" step="0.1" value="5">
                <div class="slider-labels">
                    <span>-10 μC</span>
                    <span>0</span>
                    <span>+10 μC</span>
                </div>
            </div>
            
            <div class="control-group">
                <h3>Ball Options</h3>
                <div class="checkbox-group">
                    <input type="checkbox" id="ground-toggle">
                    <label for="ground-toggle">Ground Ball</label>
                </div>
            </div>
            
            <div class="control-group">
                <h3>Visualization</h3>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-charges" checked>
                    <label for="show-charges">Show Charges</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-field">
                    <label for="show-field">Show Electric Field</label>
                </div>
            </div>
            
            <div class="control-group">
                <button id="reset-btn" class="reset-btn">Reset Simulation</button>
            </div>
        </div>
        
        <div id="physics-info">
            <h3>Physics Information</h3>
            <div id="info-content">
                <p>Ball Charge: <span id="ball-charge-display">0.00 μC</span></p>
                <p>Electrostatic Force: <span id="force-display">0.00 N</span></p>
                <p>Status: <span id="status-display">Neutral ball</span></p>
            </div>
        </div>
        
        <!-- New Activity and Assessment Panel -->
        <div id="learning-panel">
            <div class="panel-tabs">
                <button id="tab-activity" class="tab-btn active">Activity</button>
                <button id="tab-quiz" class="tab-btn">Quiz</button>
                <button id="tab-close" class="tab-btn close-btn">×</button>
            </div>
            <div id="activity-content" class="panel-content active">
                <!-- Activity content will be loaded here -->
            </div>
            <div id="quiz-content" class="panel-content">
                <!-- Quiz content will be loaded here -->
            </div>
        </div>
        
        <!-- Toggle button for Learning Panel -->
        <button id="show-learning-panel" class="floating-btn">Show Activities</button>
    </div>

    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/main.js"></script>
    <script src="js/learning-panel.js"></script>
</body>
</html>
